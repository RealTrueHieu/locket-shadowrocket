# ============================================================
# Đoạn mã chèn vào file .conf hiện tại của Shadowrocket
# (Copy các dòng dưới đây vào các phần tương ứng [Script] và [MITM])
# ============================================================

[Script]
revenuecat = type=http-response,script-path=https://raw.githubusercontent.com/RealTrueHieu/locket-shadowrocket/main/Locket_DuyVinh09.js,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$),requires-body=true,max-size=-1,timeout=60
locket_rc = type=http-response,script-path=https://raw.githubusercontent.com/RealTrueHieu/locket-shadowrocket/main/Locket_Unlocked.js,pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,requires-body=true,max-size=-1,timeout=60

[MITM]
enable = true
hostname = %APPEND% api.revenuecat.com, firebaseremoteconfig.googleapis.com
